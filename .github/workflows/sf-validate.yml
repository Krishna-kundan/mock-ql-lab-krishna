name: SF Validate

# Salesforce deploy VALIDATION for the SIMPLE pipeline (feature → main).
#
# This is one of TWO deploy-pipeline options the scaffold ships — see
# .github/workflows/README.md. Use this pair (sf-validate + sf-deploy) for a
# lightweight feature→main flow; use the feature-ci_* / feature-release-test_*
# set instead for the multi-stage develop→release/*→main flow. Pick ONE and
# delete the other set. The trust-chain gates (intent validate / drift / README
# index / test-script coverage / FLS) are NOT here — they live in
# intent-trust-chain.yml and ship in EVERY repo regardless of this choice (#57).
#
# On a PR, this runs a check-only deploy (--dry-run) against the integration org
# and confirms each ✅ criterion's named test actually ran green.

# Trigger via `paths-ignore` so ANY package directory triggers validation without
# hardcoding force-app/ (issue #64) — a repo whose packageDirectories is src/,
# packaged/, or a custom name is covered for free, because those dirs simply aren't
# in the ignore list below. The rule for this list: only omit paths that can NEVER
# hold deployable Salesforce metadata — omitting a real source dir would let a PR
# merge unvalidated (the bug this fixes). When unsure, DON'T add it here: an
# un-omitted path just triggers a runner that no-ops. `*.md` is root-only on
# purpose (a `.md` could be a static resource inside a package dir, which must
# still trigger). The validate step itself resolves the real dirs to deploy.
# Edge: these are Launchpad/tooling dirs that in practice never hold SF metadata;
# in the unusual case a repo declares one of them as a `packageDirectories` path,
# drop that entry from this list so its metadata PRs still validate.
on:
  pull_request:
    paths-ignore:
      - "launchpad/**"      # the Launchpad's folder: intents, ledgers, decisions, engine — not metadata (decisions/0082)
      - ".claude/**"        # skills, settings — not metadata
      - ".agents/**"        # vendored skills — not metadata
      - ".cursor/**"        # harness config
      - ".vscode/**"        # editor config
      - "skills-lock.json"  # so a skills-update PR doesn't spin a deploy
      - "*.md"              # root-level docs only (README, …)

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve the deployable package directories from sfdx-project.json so the
      # check-only deploy below isn't hardcoded to force-app/ (issue #64).
      # FAIL CLOSED, correctly: when we can't scope to specific subdirs (missing/
      # unparseable file, no packageDirectories, or a ROOT "." package),
      # scope_all=true → pass no --source-dir so sf validates the project's own
      # packageDirectories, rather than guessing force-app/ (fail-OPEN for a
      # custom-dir repo).
      - name: Resolve package directories
        id: resolve-dirs
        run: |
          node -e '
            const fs = require("fs");
            let dirs = null;
            try {
              const p = JSON.parse(fs.readFileSync("sfdx-project.json", "utf8"));
              dirs = (p.packageDirectories || [])
                .map(d => String((d && d.path) || "").replace(/^\.\//, "").replace(/\/+$/, ""))
                .filter(s => s !== "");
            } catch (e) { dirs = null; }
            // A path with whitespace would be split into two arguments downstream and
            // silently skip validation (#512): refuse it with the fix instead.
            const spaced = (dirs || []).find(d => /\s/.test(d));
            if (spaced) {
              console.log(`::error::Package directory ${JSON.stringify(spaced)} contains whitespace, which the deploy pipeline does not support. Rename the folder (and its sfdx-project.json path).`);
              process.exit(1);
            }
            const out = process.env.GITHUB_OUTPUT;
            const scopeAll = dirs === null || dirs.length === 0 || dirs.some(d => d === ".");
            if (scopeAll) {
              console.log("::warning::Could not scope to package directories — validating the project default (fail-closed).");
              fs.appendFileSync(out, "scope_all=true\npkg_dirs=\n");
              console.log("Package directories: <project default>");
              process.exit(0);
            }
            fs.appendFileSync(out, `scope_all=false\npkg_dirs=${dirs.join(" ")}\n`);
            console.log("Resolved package directories: " + dirs.join(" "));
          '

      # A package dir holding only .gitkeep/.DS_Store has nothing to validate; sf
      # would fail with NothingToDeploy. Detect it up front so the run still
      # authenticates (proving the org is reachable) and reports "no metadata"
      # instead of a red deploy error. A declared dir that's missing is a config
      # error, so it runs the deploy and goes red. scope_all fails closed: we can't
      # see the dirs, so we always run the check-only deploy.
      - name: Detect deployable metadata
        id: metadata
        env:
          PKG_DIRS: ${{ steps.resolve-dirs.outputs.pkg_dirs }}
          SCOPE_ALL: ${{ steps.resolve-dirs.outputs.scope_all }}
        run: |
          count=0
          if [ "$SCOPE_ALL" = "true" ]; then
            count=1
          else
            for d in $PKG_DIRS; do
              if [ -d "$d" ]; then
                n=$(find "$d" -type f ! -name '.gitkeep' ! -name '.DS_Store' | wc -l)
                count=$((count + n))
              else
                # A declared dir that isn't there is a config error for sf to report, not "nothing to deploy".
                echo "::warning::Package directory $d is declared but missing; running the check-only deploy anyway."
                count=$((count + 1))
              fi
            done
          fi
          if [ "$count" -eq 0 ]; then
            echo "::notice::No metadata files in package directories ($PKG_DIRS) — check-only deploy not needed; org authentication is still verified."
            echo "has_metadata=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_metadata=true" >> "$GITHUB_OUTPUT"
          fi

      # TEST_LEVEL (repo variable, optional): the Apex test level for the deploy
      # below. Unset → RunLocalTests, as before. Against a production-type org
      # (production, a trial), RunLocalTests enforces 75% coverage across EVERY
      # unmanaged class in the org, including Apex already there and not in this
      # repo, so a PR can fail on code it never touched. RunSpecifiedTests runs only
      # the test classes in this repo's package directories (named '*Test*.cls',
      # any case, and annotated @IsTest, so a ContestController.cls isn't taken for
      # a test) and is judged on the coverage of what's deployed. Same variable,
      # values and discovery convention as the deploy-multistage pipeline.
      - name: Build Apex test class list
        id: apex-tests
        if: vars.TEST_LEVEL == 'RunSpecifiedTests' && steps.metadata.outputs.has_metadata == 'true'
        env:
          PKG_DIRS: ${{ steps.resolve-dirs.outputs.pkg_dirs }}
          SCOPE_ALL: ${{ steps.resolve-dirs.outputs.scope_all }}
        run: |
          # PKG_DIRS via env (data, not shell source); unquoted so several dirs
          # word-split into separate find path args. scope_all → the whole checkout.
          search_dirs="$PKG_DIRS"
          [ "$SCOPE_ALL" = "true" ] && search_dirs="."
          mapfile -t test_files < <(find $search_dirs -type f -iname '*test*.cls' ! -path '*/node_modules/*' ! -path './.git/*' 2>/dev/null \
            | while IFS= read -r f; do grep -qi '@istest' "$f" && printf '%s\n' "$f"; done | sort)

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No Apex test classes matching '*Test*.cls' (case-insensitive) and annotated @IsTest were found in $search_dirs."
            # Surface, don't smooth over: source has Apex but no discoverable tests → RunSpecifiedTests
            # silently falls back to RunLocalTests and the targeted run never happens.
            if find $search_dirs -type f -iname '*.cls' ! -path '*/node_modules/*' ! -path './.git/*' 2>/dev/null | grep -q .; then
              echo "::warning::Source contains Apex classes but no test classes were discovered; RunSpecifiedTests falls back to RunLocalTests. Name test classes '*Test*.cls' (any case), annotated @IsTest, so coverage gates can confirm them."
            fi
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "test_classes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Space-separated: the deploy step passes each as its own --tests value
          # (sf takes repeated or space-separated names, not one comma-joined value).
          test_classes=$(printf '%s\n' "${test_files[@]}" \
            | sed -E 's|.*/([^/]+)\.cls$|\1|' \
            | paste -sd' ' -)

          echo "Found Apex test classes: $test_classes"
          echo "has_tests=true" >> "$GITHUB_OUTPUT"
          echo "test_classes=$test_classes" >> "$GITHUB_OUTPUT"

      - name: Install sf CLI
        run: npm install -g @salesforce/cli@latest

      # Fails closed: a missing or malformed SFDX_URL is a red check, never a
      # silent pass. The value is never echoed; only its shape is tested.
      - name: Authenticate to integration org
        id: auth
        env:
          SFDX_URL: ${{ secrets.SFDX_URL }}
        run: |
          if [ -z "$SFDX_URL" ]; then
            echo "::error::SFDX_URL secret is not set or empty — cannot authenticate to the integration org. Set it as a repo secret (see .github/workflows/README.md, 'Secret name')."
            exit 1
          fi
          case "$SFDX_URL" in
            force://*@*) ;;
            *) echo "::error::SFDX_URL secret is not a force:// auth URL — store the bare sfdxAuthUrl value that sf org auth show-sfdx-auth-url prints for an org login with a refresh token (not the --json output; sf org display only shows [REDACTED]) (see .github/workflows/README.md, 'Secret name')."; exit 1 ;;
          esac
          printf '%s' "$SFDX_URL" > /tmp/sfdx-auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth.txt --alias integration --set-default
          rm /tmp/sfdx-auth.txt
          sf org display --target-org integration --json > /dev/null \
            || { echo "::error::Logged in, but the integration org didn't respond — the auth URL may be revoked or expired."; exit 1; }

      # Runs only when there is metadata to validate. The coverage step below
      # runs with always() and already no-ops when no results file is produced.
      - name: Validate metadata (check-only deploy)
        id: deploy_validate
        if: steps.metadata.outputs.has_metadata == 'true'
        env:
          PKG_DIRS: ${{ steps.resolve-dirs.outputs.pkg_dirs }}
          SCOPE_ALL: ${{ steps.resolve-dirs.outputs.scope_all }}
          TEST_LEVEL: ${{ vars.TEST_LEVEL }}
          HAS_TESTS: ${{ steps.apex-tests.outputs.has_tests }}
          TEST_CLASSES: ${{ steps.apex-tests.outputs.test_classes }}
        run: |
          # --json captures the full run (incl. runTestResult) so the coverage
          # step can confirm each ✅ criterion's named test actually ran green.
          # Tee to a file AND keep the command's exit status (pipefail) so a real
          # validation failure still fails the build; the coverage step below runs
          # with always() so a red test is reported as the specific criterion that
          # broke, not just an opaque deploy error.
          set -o pipefail
          # One --source-dir per resolved package dir (repeatable flag) — issue #64.
          # scope_all → none, so sf validates the project's own packageDirectories.
          # PKG_DIRS via env (data), not a `$`-brace expression (shell source) — so a path can't inject.
          src_args=()
          if [ "$SCOPE_ALL" != "true" ]; then
            for d in $PKG_DIRS; do
              src_args+=(--source-dir "$d")
            done
          fi
          # TEST_LEVEL via env (data, not shell source). Unset → RunLocalTests.
          test_args=()
          if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
            if [ "$HAS_TESTS" = "true" ]; then
              test_args=(--test-level RunSpecifiedTests)
              for c in $TEST_CLASSES; do test_args+=(--tests "$c"); done
            else
              echo "::warning::TEST_LEVEL is RunSpecifiedTests but no test classes were found in the source. Falling back to RunLocalTests."
              test_args=(--test-level RunLocalTests)
            fi
          else
            test_args=(--test-level "${TEST_LEVEL:-RunLocalTests}")
          fi
          # The level that actually ran, for the coverage step below.
          echo "test_level=${test_args[1]}" >> "$GITHUB_OUTPUT"
          # `deploy validate` rejects NoTestRun (a validation must run tests), so a
          # sandbox set to NoTestRun gets a plain check-only deploy instead.
          validate_cmd=(sf project deploy validate)
          [ "${test_args[1]}" = "NoTestRun" ] && validate_cmd=(sf project deploy start --dry-run)
          "${validate_cmd[@]}" \
            --target-org integration \
            "${src_args[@]}" \
            "${test_args[@]}" \
            --json | tee apex-test-results.json

      # Turns ✅ from the author's assertion into a CI-confirmed proof: each ✅
      # criterion's named Class.method test must be GREEN in the run above. A red
      # test fails the gate. When the run covered every test class in the source
      # (RunLocalTests, RunAllTestsInOrg, or RunSpecifiedTests over the discovered
      # classes), --tests-complete also fails a Delivered intent whose named method
      # is absent from a class that ran. RunRelevantTests picks a subset and
      # NoTestRun runs nothing, so neither is declared complete: their unrun ✅
      # criteria are surfaced as unconfirmed, not failed. Runs even when the
      # deploy-validate step failed (always()), so the output names the criterion
      # whose proof broke. No-ops if results weren't produced (no metadata in the
      # package dirs) — the structural coverage gate already ran in
      # intent-trust-chain.yml regardless.
      - name: Confirm ✅ criteria against CI test results
        if: always() && hashFiles('launchpad/scripts/intent-ledger.mjs') != ''
        env:
          RAN_LEVEL: ${{ steps.deploy_validate.outputs.test_level }}
        run: |
          complete=()
          case "$RAN_LEVEL" in RunLocalTests|RunAllTestsInOrg|RunSpecifiedTests) complete=(--tests-complete) ;; esac
          if [ -s apex-test-results.json ]; then
            # One pass per engagement this PR gates (decisions/0082 W1).
            for slug in $(node launchpad/scripts/intent-ledger.mjs engagements --base "origin/${GITHUB_BASE_REF}"); do
              dir="launchpad/engagements/$slug"
              if [ -d "$dir/intents" ] && [ -f "$dir/delivery/intent-ledger.md" ]; then
                echo "── $slug"
                LAUNCHPAD_ENGAGEMENT="$slug" node launchpad/scripts/intent-ledger.mjs coverage --gate --results apex-test-results.json "${complete[@]}"
              fi
            done
          else
            echo "No test results (no metadata to validate, or an earlier step failed) — CI-proof confirmation not run; the structural coverage gate already ran in intent-trust-chain.yml."
          fi
