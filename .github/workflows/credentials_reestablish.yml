# Re-applies External Credential secrets to a sandbox after a refresh (INT-009).
# Engagement-owned. Manual run only, sandboxes only.
# Which credentials: config/credentials.json (names only, no secrets).
# The values: the chosen environment's EXTERNAL_CREDENTIAL_SECRETS secret, a JSON
# map keyed "<credential>/<principal>". Values never touch the repo or the log.
name: credentials_reestablish

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "The refreshed sandbox's GitHub Environment"
        required: true
        type: choice
        options:
          - CI
          - TEST

concurrency:
  group: credentials-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  reestablish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the credential list
        id: list
        shell: bash -e {0}
        run: |
          count=$(node -e 'const l = JSON.parse(require("fs").readFileSync("config/credentials.json", "utf8")); if (!Array.isArray(l)) { throw new Error("config/credentials.json must be a JSON array"); } console.log(l.length);')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "::notice::config/credentials.json lists no External Credentials. Nothing to re-establish."
          fi

      - name: Install Salesforce CLI
        if: steps.list.outputs.count != '0'
        shell: bash -e {0}
        run: npm install --global @salesforce/cli

      - name: Authenticate to the sandbox (SFDX URL)
        if: steps.list.outputs.count != '0'
        shell: bash -e {0}
        env:
          SFDX_URL: ${{ secrets.SFDX_URL }}
          TIER: ${{ inputs.environment }}
        run: |
          if [ -z "$SFDX_URL" ]; then
            echo "::error::Missing required secret SFDX_URL on the $TIER environment."
            exit 1
          fi
          echo "$SFDX_URL" > ./sfdx_auth_url.txt
          sf org login sfdx-url --sfdx-url-file ./sfdx_auth_url.txt --alias target
          rm -f ./sfdx_auth_url.txt

      - name: Refuse anything but a sandbox
        if: steps.list.outputs.count != '0'
        shell: bash -e {0}
        env:
          TIER: ${{ inputs.environment }}
        run: |
          is_sandbox=$(sf data query --target-org target --query "SELECT IsSandbox FROM Organization" --json \
            | node -e 'let s = ""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).result.records[0].IsSandbox));')
          if [ "$is_sandbox" != "true" ]; then
            echo "::error::The $TIER org isn't a sandbox. This workflow only writes credentials to a refreshed sandbox."
            exit 1
          fi

      - name: Write each External Credential's values
        if: steps.list.outputs.count != '0'
        shell: bash -e {0}
        env:
          SECRETS_JSON: ${{ secrets.EXTERNAL_CREDENTIAL_SECRETS }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          (async () => {
            const list = JSON.parse(fs.readFileSync("config/credentials.json", "utf8"));
            let values;
            try {
              values = JSON.parse(process.env.SECRETS_JSON || "");
            } catch {
              console.log("::error::EXTERNAL_CREDENTIAL_SECRETS is missing on this environment or isn't valid JSON.");
              process.exit(1);
            }

            const org = JSON.parse(execFileSync("sf", ["org", "display", "--target-org", "target", "--json"], { encoding: "utf8" })).result;
            console.log(`::add-mask::${org.accessToken}`);
            const url = `${org.instanceUrl}/services/data/v${org.apiVersion}/named-credentials/credential/`;

            let failed = 0;
            for (const entry of list) {
              const key = `${entry.credential}/${entry.principal}`;
              const credentials = values[key];
              if (!credentials) {
                console.log(`::error::No values for ${key} in EXTERNAL_CREDENTIAL_SECRETS.`);
                failed++;
                continue;
              }
              const res = await fetch(url, {
                method: "POST",
                headers: { Authorization: `Bearer ${org.accessToken}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                  externalCredential: entry.credential,
                  principalName: entry.principal,
                  principalType: entry.principalType,
                  credentials,
                }),
              });
              if (res.ok) {
                console.log(`Re-established ${key}.`);
              } else {
                let detail = "";
                try {
                  detail = (await res.json()).map(e => `${e.errorCode}: ${e.message}`).join("; ");
                } catch {}
                console.log(`::error::${key} failed (HTTP ${res.status}) ${detail}`);
                failed++;
              }
            }
            if (failed) {
              process.exit(1);
            }
          })();
          EOF
