# This workflow deploys code merged to develop branch to the CI sandbox
name: feature-ci_deploy

on:
  push:
    branches:
      - "develop"

jobs:
  feature-deploy:
    runs-on: ubuntu-latest
    environment: CI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The steps live once, in .github/actions/multistage/action.yml, so the
      # CI and TEST tiers can't drift apart (#505).
      - name: Deploy to the CI sandbox
        uses: ./.github/actions/multistage
        with:
          mode: deploy
          environment: CI
          sfdx_url: ${{ secrets.SFDX_URL }}
          test_level: ${{ vars.TEST_LEVEL }}
