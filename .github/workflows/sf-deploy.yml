name: SF Deploy

# Salesforce DEPLOY for the SIMPLE pipeline (feature → main). The deploy half of
# the sf-validate + sf-deploy pair — see .github/workflows/README.md for the
# two-pipeline choice (#57). Triggers on a push to main (i.e. a human merged the
# PR); deploys to the integration org. Uses the same SFDX_URL secret as
# sf-validate (reconciled from the old SFDX_AUTH_URL_INTEGRATION, #57).

# NOTE: this `paths:` trigger is static YAML — GitHub can't read it from
# sfdx-project.json. It defaults to force-app/. If your repo declares a
# different packageDirectories path (src/, packaged/, …), ADD that path here so a
# merge that touches only that dir still deploys (issue #64). The deploy step
# itself resolves the real dirs.
on:
  push:
    branches: [main]
    paths:
      - "force-app/**"
      - "sfdx-project.json"
      - "config/**"
      - ".github/workflows/sf-deploy.yml"
  workflow_dispatch:

concurrency:
  group: sf-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Resolve the deployable package directories from sfdx-project.json so the
      # deploy below isn't hardcoded to force-app/ (issue #64).
      # FAIL CLOSED, correctly: when we can't scope to specific subdirs (missing/
      # unparseable file, no packageDirectories, or a ROOT "." package),
      # scope_all=true → pass no --source-dir so sf deploys the project's own
      # packageDirectories, rather than guessing force-app/ (fail-OPEN for a
      # custom-dir repo).
      - name: Resolve package directories
        id: resolve-dirs
        run: |
          node -e '
            const fs = require("fs");
            let dirs = null;
            try {
              const p = JSON.parse(fs.readFileSync("sfdx-project.json", "utf8"));
              dirs = (p.packageDirectories || [])
                .map(d => String((d && d.path) || "").replace(/^\.\//, "").replace(/\/+$/, ""))
                .filter(s => s !== "");
            } catch (e) { dirs = null; }
            // A path with whitespace would be split into two arguments downstream and
            // silently skip validation (#512): refuse it with the fix instead.
            const spaced = (dirs || []).find(d => /\s/.test(d));
            if (spaced) {
              console.log(`::error::Package directory ${JSON.stringify(spaced)} contains whitespace, which the deploy pipeline does not support. Rename the folder (and its sfdx-project.json path).`);
              process.exit(1);
            }
            const out = process.env.GITHUB_OUTPUT;
            const scopeAll = dirs === null || dirs.length === 0 || dirs.some(d => d === ".");
            if (scopeAll) {
              console.log("::warning::Could not scope to package directories — deploying the project default (fail-closed).");
              fs.appendFileSync(out, "scope_all=true\npkg_dirs=\n");
              console.log("Package directories: <project default>");
              process.exit(0);
            }
            fs.appendFileSync(out, `scope_all=false\npkg_dirs=${dirs.join(" ")}\n`);
            console.log("Resolved package directories: " + dirs.join(" "));
          '

      # TEST_LEVEL (repo variable, optional): the Apex test level for the deploy
      # below. Unset → RunLocalTests, as before. Against a production-type org
      # (production, a trial), RunLocalTests enforces 75% coverage across EVERY
      # unmanaged class in the org, including Apex already there and not in this
      # repo, so a PR can fail on code it never touched. RunSpecifiedTests runs only
      # the test classes in this repo's package directories (named '*Test*.cls',
      # any case, and annotated @IsTest, so a ContestController.cls isn't taken for
      # a test) and is judged on the coverage of what's deployed. Same variable,
      # values and discovery convention as the deploy-multistage pipeline.
      - name: Build Apex test class list
        id: apex-tests
        if: vars.TEST_LEVEL == 'RunSpecifiedTests'
        env:
          PKG_DIRS: ${{ steps.resolve-dirs.outputs.pkg_dirs }}
          SCOPE_ALL: ${{ steps.resolve-dirs.outputs.scope_all }}
        run: |
          # PKG_DIRS via env (data, not shell source); unquoted so several dirs
          # word-split into separate find path args. scope_all → the whole checkout.
          search_dirs="$PKG_DIRS"
          [ "$SCOPE_ALL" = "true" ] && search_dirs="."
          mapfile -t test_files < <(find $search_dirs -type f -iname '*test*.cls' ! -path '*/node_modules/*' ! -path './.git/*' 2>/dev/null \
            | while IFS= read -r f; do grep -qi '@istest' "$f" && printf '%s\n' "$f"; done | sort)

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No Apex test classes matching '*Test*.cls' (case-insensitive) and annotated @IsTest were found in $search_dirs."
            # Surface, don't smooth over: source has Apex but no discoverable tests → RunSpecifiedTests
            # silently falls back to RunLocalTests and the targeted run never happens.
            if find $search_dirs -type f -iname '*.cls' ! -path '*/node_modules/*' ! -path './.git/*' 2>/dev/null | grep -q .; then
              echo "::warning::Source contains Apex classes but no test classes were discovered; RunSpecifiedTests falls back to RunLocalTests. Name test classes '*Test*.cls' (any case), annotated @IsTest, so coverage gates can confirm them."
            fi
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "test_classes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Space-separated: the deploy step passes each as its own --tests value
          # (sf takes repeated or space-separated names, not one comma-joined value).
          test_classes=$(printf '%s\n' "${test_files[@]}" \
            | sed -E 's|.*/([^/]+)\.cls$|\1|' \
            | paste -sd' ' -)

          echo "Found Apex test classes: $test_classes"
          echo "has_tests=true" >> "$GITHUB_OUTPUT"
          echo "test_classes=$test_classes" >> "$GITHUB_OUTPUT"

      - name: Install sf CLI
        run: npm install -g @salesforce/cli@latest

      - name: Authenticate to integration org
        env:
          SFDX_URL: ${{ secrets.SFDX_URL }}
        run: |
          if [ -z "$SFDX_URL" ]; then
            echo "::error::SFDX_URL secret not set — cannot deploy. Set it as a repo secret (see .github/workflows/README.md, 'Secret name')."
            exit 1
          fi
          printf '%s' "$SFDX_URL" > /tmp/sfdx-auth.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth.txt --alias integration --set-default
          rm /tmp/sfdx-auth.txt

      - name: Deploy to integration
        env:
          PKG_DIRS: ${{ steps.resolve-dirs.outputs.pkg_dirs }}
          SCOPE_ALL: ${{ steps.resolve-dirs.outputs.scope_all }}
          TEST_LEVEL: ${{ vars.TEST_LEVEL }}
          HAS_TESTS: ${{ steps.apex-tests.outputs.has_tests }}
          TEST_CLASSES: ${{ steps.apex-tests.outputs.test_classes }}
        run: |
          # One --source-dir per resolved package dir (repeatable flag) — issue #64.
          # scope_all → none, so sf deploys the project's own packageDirectories.
          # PKG_DIRS via env (data), not a `$`-brace expression (shell source) — so a path can't inject.
          src_args=()
          if [ "$SCOPE_ALL" != "true" ]; then
            for d in $PKG_DIRS; do
              src_args+=(--source-dir "$d")
            done
          fi
          # TEST_LEVEL via env (data, not shell source). Unset → RunLocalTests.
          test_args=()
          if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
            if [ "$HAS_TESTS" = "true" ]; then
              test_args=(--test-level RunSpecifiedTests)
              for c in $TEST_CLASSES; do test_args+=(--tests "$c"); done
            else
              echo "::warning::TEST_LEVEL is RunSpecifiedTests but no test classes were found in the source. Falling back to RunLocalTests."
              test_args=(--test-level RunLocalTests)
            fi
          else
            test_args=(--test-level "${TEST_LEVEL:-RunLocalTests}")
          fi
          sf project deploy start --target-org integration "${src_args[@]}" "${test_args[@]}"
